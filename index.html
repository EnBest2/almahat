<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÖrökségSzéf — Digitális Végrendelet és Vészhelyzeti Széf</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #080b12;
  --panel: #111624;
  --panel2: #171d2e;
  --panel3: #1d2437;
  --border: #232b42;
  --text: #e8eefc;
  --muted: #8a94ab;
  --accent: #5b8dff;
  --accent2: #9d6dff;
  --danger: #ff5470;
  --success: #2fd584;
  --warn: #ffbb4d;
  --radius: 12px;
}
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  background: radial-gradient(1200px 600px at 20% -10%, #16203a 0%, transparent 60%),
              radial-gradient(900px 500px at 100% 0%, #1a1230 0%, transparent 55%),
              var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.5;
}
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
input, textarea, select {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  width: 100%;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(91,141,255,.15);
}
textarea { resize: vertical; min-height: 90px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.field { margin-bottom: 14px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px;
  border-radius: 9px;
  background: var(--panel3);
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 500;
  transition: all .15s;
  white-space: nowrap;
}
.btn:hover { background: #232b45; border-color: #333c5c; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: white; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { background: rgba(255,84,112,.1); border-color: rgba(255,84,112,.35); color: var(--danger); }
.btn.danger:hover { background: rgba(255,84,112,.18); }
.btn.success { background: rgba(47,213,132,.1); border-color: rgba(47,213,132,.35); color: var(--success); }
.btn.success:hover { background: rgba(47,213,132,.2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--panel2); color: var(--text); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.xs { padding: 4px 9px; font-size: 12px; border-radius: 6px; }

/* ---- Lock / Setup ---- */
.lock-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.lock-card {
  width: 100%;
  max-width: 440px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 30px 80px rgba(0,0,0,.5);
}
.lock-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.logo {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 18px; color: white;
  box-shadow: 0 6px 20px rgba(91,141,255,.35);
}
.lock-brand h1 { font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
.lock-sub { color: var(--muted); font-size: 13.5px; margin-bottom: 26px; line-height: 1.55; }

/* ---- App shell ---- */
.app {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
}
.sidebar {
  background: linear-gradient(180deg, var(--panel), #0d121e);
  border-right: 1px solid var(--border);
  padding: 22px 16px;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto;
}
.side-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 0 8px 22px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.side-brand .logo { width: 32px; height: 32px; font-size: 15px; }
.side-brand h1 { font-size: 15px; font-weight: 650; }
.side-brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px;
  border-radius: 9px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  margin-bottom: 2px;
  transition: all .12s;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: var(--panel2); color: var(--text); }
.nav-item.active { background: linear-gradient(135deg, rgba(91,141,255,.18), rgba(157,109,255,.12)); color: var(--text); }
.nav-item .ico { width: 18px; text-align: center; opacity: .85; }
.nav-item .badge {
  margin-left: auto;
  background: var(--panel3);
  color: var(--muted);
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 600;
}
.side-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
.checkin-mini {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  font-size: 12px;
}
.checkin-mini .lbl { color: var(--muted); margin-bottom: 4px; }
.checkin-mini .val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

.main { padding: 32px 40px 60px; max-width: 1100px; }
.page-head { margin-bottom: 26px; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.page-head h2 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.page-head p { color: var(--muted); font-size: 14px; margin-top: 4px; }

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.card h3 { font-size: 15px; font-weight: 650; margin-bottom: 14px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: relative; height: auto; }
  .main { padding: 20px; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

/* Check-in hero */
.hero {
  background: linear-gradient(135deg, rgba(91,141,255,.10), rgba(157,109,255,.06));
  border: 1px solid rgba(91,141,255,.25);
  border-radius: 14px;
  padding: 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.hero.warn { background: linear-gradient(135deg, rgba(255,187,77,.12), rgba(255,84,112,.06)); border-color: rgba(255,187,77,.35); }
.hero.danger { background: linear-gradient(135deg, rgba(255,84,112,.14), rgba(255,84,112,.05)); border-color: rgba(255,84,112,.45); }
.hero .num { font-size: 44px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.hero .sub { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
.hero .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-bottom: 6px; }

.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 700px){ .stat-row { grid-template-columns: repeat(2,1fr); } }
.stat {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 14px 16px;
}
.stat .k { color: var(--muted); font-size: 12px; font-weight: 500; }
.stat .v { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }

/* Item list */
.item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 11px;
  margin-bottom: 8px;
  transition: all .12s;
}
.item:hover { border-color: #2c3757; background: var(--panel2); }
.item-ico {
  width: 38px; height: 38px;
  border-radius: 9px;
  background: var(--panel3);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
}
.item-body { flex: 1; min-width: 0; }
.item-body .title { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-body .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  background: var(--panel3);
  color: var(--muted);
  margin-right: 6px;
}
.tag.blue { background: rgba(91,141,255,.15); color: #8bb0ff; }
.tag.green { background: rgba(47,213,132,.15); color: #5fe0a0; }
.tag.orange { background: rgba(255,187,77,.15); color: #ffcc74; }
.tag.purple { background: rgba(157,109,255,.15); color: #bb9bff; }

.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--muted);
}
.empty .big { font-size: 42px; margin-bottom: 12px; opacity: .5; }

/* Modal */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(4,6,12,.75);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  z-index: 100;
  animation: fade .15s ease-out;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 100%;
  max-width: 560px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 40px 100px rgba(0,0,0,.6);
  animation: pop .18s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-head {
  padding: 18px 22px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0;
  background: var(--panel);
  z-index: 1;
}
.modal-head h3 { font-size: 16px; font-weight: 650; }
.modal-body { padding: 22px; }
.modal-foot {
  padding: 16px 22px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 10px;
  position: sticky; bottom: 0;
  background: var(--panel);
}
.close-x { color: var(--muted); font-size: 22px; line-height: 1; padding: 0 4px; }
.close-x:hover { color: var(--text); }

/* Toast */
.toasts {
  position: fixed;
  bottom: 20px; right: 20px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 200;
}
.toast {
  background: var(--panel3);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 9px;
  padding: 12px 16px;
  font-size: 13.5px;
  box-shadow: 0 20px 50px rgba(0,0,0,.5);
  animation: slide .2s ease-out;
  max-width: 320px;
}
.toast.success { border-left-color: var(--success); }
.toast.danger { border-left-color: var(--danger); }
.toast.warn { border-left-color: var(--warn); }
@keyframes slide { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

.code-display {
  background: #05070d;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 14px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13px;
  word-break: break-all;
  color: #a7b6d6;
  line-height: 1.6;
}

.switch {
  display: inline-flex;
  width: 42px; height: 24px;
  background: var(--panel3);
  border-radius: 20px;
  position: relative;
  cursor: pointer;
  transition: background .15s;
  border: 1px solid var(--border);
  flex-shrink: 0;
}
.switch.on { background: var(--accent); border-color: var(--accent); }
.switch::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  background: white;
  border-radius: 50%;
  transition: transform .18s;
}
.switch.on::after { transform: translateX(18px); }

.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.hint { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.danger-zone { border-color: rgba(255,84,112,.35); }
.danger-zone h3 { color: var(--danger); }

.avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #5b8dff, #9d6dff);
  display: flex; align-items: center; justify-content: center;
  font-weight: 650; font-size: 14px; color: white;
  flex-shrink: 0;
}
.avatar.g2 { background: linear-gradient(135deg, #2fd584, #5b8dff); }
.avatar.g3 { background: linear-gradient(135deg, #ff5470, #9d6dff); }
.avatar.g4 { background: linear-gradient(135deg, #ffbb4d, #ff5470); }
.avatar.g5 { background: linear-gradient(135deg, #9d6dff, #2fd584); }

.kbd {
  display: inline-block;
  padding: 2px 6px;
  background: var(--panel3);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 5px;
  font-family: ui-monospace, monospace;
  font-size: 11.5px;
  color: var(--muted);
}

.checklist { list-style: none; }
.checklist li { display: flex; gap: 10px; padding: 8px 0; align-items: flex-start; font-size: 14px; }
.checklist li::before { content: '✓'; color: var(--success); font-weight: 700; flex-shrink: 0; }

.scroll-x { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
tr:last-child td { border-bottom: none; }
</style>

<body>
<div id="root"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ============================================================
   ÖrökségSzéf — teljes egyoldalas alkalmazás
   Minden adat helyben, AES-GCM-mel titkosítva, a jelszóból
   PBKDF2-vel származtatott kulccsal. Nincs szerver.
   ============================================================ */

const STORAGE_KEY = 'orokseg_szef_v1';
const SESSION_TIMEOUT_MS = 10 * 60 * 1000; // 10 perc

const state = {
  key: null,
  salt: null,
  data: null,
  unlocked: false,
  tab: 'dashboard',
  lastActivity: Date.now(),
  modal: null,
};

/* ---------- Crypto helpers ---------- */
function b64(buf) {
  const bytes = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function unb64(str) {
  const bin = atob(str);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function deriveKey(password, salt, iterations = 300000) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
async function encryptJSON(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const pt = new TextEncoder().encode(JSON.stringify(obj));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, pt);
  return { iv: b64(iv), ct: b64(ct) };
}
async function decryptJSON(key, blob) {
  const iv = unb64(blob.iv);
  const ct = unb64(blob.ct);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function randomId() {
  return crypto.getRandomValues(new Uint8Array(8)).reduce((a, b) => a + b.toString(16).padStart(2, '0'), '');
}
function randomPassphrase(words = 5) {
  const list = ['alma','hegy','folyó','kék','csillag','erdő','tenger','hold','tűz','szél','kő','madár','virág','hajnal','éj','híd','vár','kapu','út','felhő','eső','hó','nap','homok','üveg','vas','ezüst','arany','kert','mező','patak','sziget','barlang','tükör','lámpás','kulcs','zár','könyv','toll','térkép','iránytű','hajó','vitorla','kikötő','torony','harang','zászló','pajzs','kard','nyíl'];
  const out = [];
  const rnd = crypto.getRandomValues(new Uint32Array(words));
  for (let i = 0; i < words; i++) out.push(list[rnd[i] % list.length]);
  return out.join('-');
}

/* ---------- Storage ---------- */
function loadRaw() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    return s ? JSON.parse(s) : null;
  } catch { return null; }
}
async function persist() {
  if (!state.key || !state.data) return;
  const blob = await encryptJSON(state.key, state.data);
  const payload = { v: 1, salt: b64(state.salt), iv: blob.iv, ct: blob.ct, updated: Date.now() };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
}
function emptyData() {
  return {
    items: [],
    recipients: [],
    config: {
      checkInIntervalDays: 30,
      gracePeriodDays: 7,
      lastCheckIn: Date.now(),
      createdAt: Date.now(),
      emergencyNote: '',
      executorName: '',
      executorContact: '',
    },
    log: [],
  };
}
function logEvent(msg) {
  if (!state.data) return;
  state.data.log.unshift({ t: Date.now(), msg });
  if (state.data.log.length > 300) state.data.log.length = 300;
}

/* ---------- Toast ---------- */
function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(20px)';
    setTimeout(() => el.remove(), 320);
  }, 3200);
}

/* ---------- Utils ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('hu-HU', { year: 'numeric', month: 'short', day: 'numeric' });
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  return d.toLocaleString('hu-HU', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function relTime(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'most';
  if (m < 60) return m + ' perce';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' órája';
  const d = Math.floor(h / 24);
  if (d < 30) return d + ' napja';
  return fmtDate(ts);
}

const ITEM_TYPES = {
  password: { label: 'Jelszó / fiók', icon: '🔑', color: 'blue' },
  bank:     { label: 'Bank / pénzügy', icon: '💳', color: 'green' },
  crypto:   { label: 'Kriptopénztárca', icon: '🪙', color: 'orange' },
  insurance:{ label: 'Biztosítás', icon: '🛡️', color: 'purple' },
  message:  { label: 'Személyes üzenet', icon: '💌', color: 'blue' },
  doc:      { label: 'Dokumentum / hely', icon: '📄', color: 'green' },
  access:   { label: 'Hozzáférés / eszköz', icon: '🔐', color: 'purple' },
  other:    { label: 'Egyéb', icon: '📌', color: '' },
};

/* ---------- Check-in status ---------- */
function checkinStatus() {
  const c = state.data.config;
  const last = c.lastCheckIn;
  const deadline = last + c.checkInIntervalDays * 86400000;
  const graceEnd = deadline + c.gracePeriodDays * 86400000;
  const now = Date.now();
  const daysLeft = Math.ceil((deadline - now) / 86400000);
  const graceLeft = Math.ceil((graceEnd - now) / 86400000);
  let status = 'ok';
  if (now >= graceEnd) status = 'overdue';
  else if (now >= deadline) status = 'grace';
  else if (daysLeft <= 5) status = 'warn';
  return { status, daysLeft, graceLeft, deadline, graceEnd, last };
}

/* ============================================================
   RENDER — Lock / Setup
   ============================================================ */
function renderLock(root) {
  const existing = loadRaw();
  const isSetup = !existing;
  root.innerHTML = `
    <div class="lock-wrap">
      <div class="lock-card">
        <div class="lock-brand">
          <div class="logo">Ö</div>
          <h1>ÖrökségSzéf</h1>
        </div>
        <p class="lock-sub">${isSetup
          ? 'Hozd létre a széfed. Egyetlen mesterjelszó védi az összes jelszavadat, üzenetedet és utasításodat, amit a szeretteidnek hagysz.'
          : 'Írd be a mesterjelszavad a széf feloldásához.'}</p>

        <div class="field">
          <label>Mesterjelszó</label>
          <input type="password" id="pw1" autocomplete="${isSetup ? 'new-password' : 'current-password'}" placeholder="••••••••••••">
        </div>
        ${isSetup ? `
        <div class="field">
          <label>Mesterjelszó újra</label>
          <input type="password" id="pw2" autocomplete="new-password" placeholder="••••••••••••">
        </div>
        <div class="field">
          <div class="row between">
            <label style="margin:0">Erős jelszót generálok</label>
            <button class="btn sm ghost" id="genpw">Generálás</button>
          </div>
        </div>
        <div class="hint" style="margin-bottom:18px">
          ⚠️ Ez a jelszó <b>nem állítható vissza</b>. Írd fel papírra, és tartsd biztonságos helyen — a széf kulcsa ebből származik.
        </div>` : `<div style="height:8px"></div>`}
        <button class="btn primary" id="submitBtn" style="width:100%; padding:12px">
          ${isSetup ? 'Széf létrehozása' : 'Feloldás'}
        </button>
        ${!isSetup ? `
        <div style="margin-top:16px; text-align:center">
          <button class="btn ghost sm" id="wipeBtn">Minden adat törlése</button>
        </div>` : ''}
      </div>
    </div>
  `;

  if (isSetup) {
    document.getElementById('genpw').onclick = () => {
      const p = randomPassphrase(5) + '-' + Math.floor(Math.random() * 9000 + 1000);
      document.getElementById('pw1').value = p;
      document.getElementById('pw2').value = p;
      toast('Erős jelszó generálva', 'success');
    };
  } else {
    document.getElementById('wipeBtn').onclick = () => {
      if (confirm('Biztosan TÖRLÖD a széfet és minden benne lévő adatot? Ez nem visszavonható.')) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    };
  }

  const submit = async () => {
    const p1 = document.getElementById('pw1').value;
    const p2 = isSetup ? document.getElementById('pw2').value : p1;
    if (p1.length < 8) { toast('A jelszó legalább 8 karakter legyen', 'danger'); return; }
    if (isSetup && p1 !== p2) { toast('A két jelszó nem egyezik', 'danger'); return; }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = isSetup ? 'Titkosítás…' : 'Feloldás…';

    try {
      if (isSetup) {
        state.salt = crypto.getRandomValues(new Uint8Array(16));
        state.key = await deriveKey(p1, state.salt);
        state.data = emptyData();
        logEvent('Széf létrehozva');
        await persist();
      } else {
        const raw = loadRaw();
        state.salt = unb64(raw.salt);
        state.key = await deriveKey(p1, state.salt);
        state.data = await decryptJSON(state.key, { iv: raw.iv, ct: raw.ct });
        // normalize
        state.data.items ||= [];
        state.data.recipients ||= [];
        state.data.config ||= emptyData().config;
        state.data.log ||= [];
        logEvent('Széf feloldva');
      }
      state.unlocked = true;
      state.lastActivity = Date.now();
      render();
    } catch (e) {
      toast('Hibás jelszó vagy sérült adat', 'danger');
      btn.disabled = false;
      btn.textContent = isSetup ? 'Széf létrehozása' : 'Feloldás';
    }
  };

  document.getElementById('submitBtn').onclick = submit;
  document.querySelectorAll('#pw1,#pw2').forEach(el => {
    el.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
  });
  setTimeout(() => document.getElementById('pw1').focus(), 50);
}

/* ============================================================

function renderApp(root) {

  root.innerHTML = `
    <div class="app">
      <aside class="sidebar">
        <div class="side-brand">

          ${navBtn('recipients', '👥', 'Kedvezményezettek', recipients.length)}
          ${navBtn('switch', '⏱️', 'Kapcsoló', s.status !== 'ok' ? '!' : '')}
          ${navBtn('log', '📜', 'Napló')}
          ${navBtn('settings', '⚙️', 'Beállítások')}
        </nav>

          <div class="checkin-mini">
            <div class="lbl">Következő bejelentkezés</div>
            <div class="val" style="color:${s.status === 'ok' ? 'var(--success)' : s.status === 'warn' ? 'var(--warn)' : 'var(--danger)'}">
              ${s.daysLeft > 0 ? s.daysLeft + ' nap' : (s.status === 'grace' ? 'Türelmi idő' : 'LEJÁRT')}
            </div>
            <button class="btn xs success" style="margin-top:8px; width:100%" onclick="doCheckIn()">Bejelentkezés</button>
          </div>
          <button class="btn ghost sm" style="width:100%; margin-top:10px" onclick="lockNow()">🔒 Zárolás</button>
        </div>

      <main class="main">

          <div>
            <h2>${esc(title)}</h2>

          <div id="pageActions"></div>
        </div>
        <div id="pageBody"></div>
      </main>
    </div>
  `;

  document.querySelectorAll('.nav-item').forEach(el => {
    el.onclick = () => { state.tab = el.dataset.tab; render(); };
  });

  const body = document.getElementById('pageBody');

  if (state.tab === 'dashboard') renderDashboard(body, actions, s);
  else if (state.tab === 'vault') renderVault(body, actions);
  else if (state.tab === 'recipients') renderRecipients(body, actions);
  else if (state.tab === 'switch') renderSwitch(body, actions, s);
  else if (state.tab === 'log') renderLog(body, actions);
  else if (state.tab === 'settings') renderSettings(body, actions);

  if (state.modal) renderModal();
}

function navBtn(tab, icon, label, badge) {
  return `<button class="nav-item ${state.tab === tab ? 'active' : ''}" data-tab="${tab}">
    <span class="ico">${icon}</span>
    <span>${label}</span>
    ${badge ? `<span class="badge">${badge}</span>` : ''}

}

/* ---------- Dashboard ---------- */

    heroClass = 'danger';
    heroNum = s.graceLeft + ' nap';
    heroSub = `Türelmi időszak. Ha nem jelentkezel be, a széf kioldódik a kedvezményezetteknek.`;
  } else if (s.status === 'warn') {
    heroClass = 'warn';
    heroNum = s.daysLeft + ' nap';
    heroSub = `Hamarosan esedékes a bejelentkezés. Kattints a "Bejelentkezés most" gombra.`;
  } else {
    heroNum = s.daysLeft + ' nap';
    heroSub = `Következő esedékes bejelentkezés: ${fmtDate(s.deadline)}`;
  }

  body.innerHTML = `
    <div class="hero ${heroClass}">
      <div>
        <div class="label">Halott ember kapcsoló állapota</div>

        <div class="sub">${heroSub}</div>

    </div>

      <div class="stat"><div class="k">Széf elemek</div><div class="v">${totalItems}</div></div>
      <div class="stat"><div class="k">Kedvezményezettek</div><div class="v">${totalRec}</div></div>
      <div class="stat"><div class="k">Hozzárendelve</div><div class="v">${assigned}/${totalItems}</div></div>
      <div class="stat"><div class="k">Utolsó bejelentkezés</div><div class="v" style="font-size:15px">${relTime(s.last)}</div></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3>Legutóbbi elemek</h3>
        ${state.data.items.length === 0
          ? `<div class="empty" style="padding:24px 0"><div class="big">🗄️</div><div>Még nincs semmi a széfben</div></div>`
          : state.data.items.slice(-5).reverse().map(i => {
              const t = ITEM_TYPES[i.type] || ITEM_TYPES.other;
              return `<div class="item" style="padding:10px 12px; margin-bottom:6px">
                <div class="item-ico" style="width:32px;height:32px;font-size:15px">${t.icon}</div>
                <div class="item-body">
                  <div class="title" style="font-size:13.5px">${esc(i.title)}</div>
                  <div class="meta">${fmtDate(i.created)}</div>
                </div>
              </div>`;
            }).join('')
        }
      </div>
      <div class="card">
        <h3>Induláshoz — 4 lépés</h3>
        <ul class="checklist">
          <li style="${state.data.items.length ? 'opacity:.5' : ''}">Adj hozzá legalább 3 jelszót vagy üzenetet</li>
          <li style="${state.data.recipients.length ? 'opacity:.5' : ''}">Vegyél fel egy kedvezményezettet</li>
          <li style="${assigned > 0 ? 'opacity:.5' : ''}">Rendelj elemeket a kedvezményezetthez</li>
          <li style="${state.data.config.executorName ? 'opacity:.5' : ''}">Adj meg egy végrehajtót / ügyvédet</li>
        </ul>
        ${!state.data.config.executorName ? `
        <button class="btn sm" style="margin-top:10px" onclick="state.tab='settings';render()">Beállítás →</button>` : ''}

        Minden adat a böngésződben, AES-256-GCM-mel titkosítva tárolódik. A mesterjelszóból PBKDF2 (300 000 iteráció) származtatja a kulcsot.
        Nincs szerver, nincs felhő, nincs nyomkövetés. A „halott ember kapcsoló” csak akkor old ki, ha te beállítod — ezen a gépen.

/* ---------- Vault ---------- */
function renderVault(body, actions) {
  actions.innerHTML = `<button class="btn primary" onclick="openItemModal()">+ Új elem</button>`;

  if (state.data.items.length === 0) {
    body.innerHTML = `<div class="empty"><div class="big">🗄️</div>
      <h3 style="margin-bottom:6px;color:var(--text)">A széf üres</h3>
      <p>Adj hozzá jelszavakat, bankkártya-adatokat, kriptotárcát, személyes üzeneteket.</p>
      <button class="btn primary" style="margin-top:16px" onclick="openItemModal()">+ Első elem hozzáadása</button>
    </div>`;
    return;
  }

  const groups = {};
  state.data.items.forEach(i => {
    const t = i.type || 'other';
    (groups[t] ||= []).push(i);
  });

  body.innerHTML = Object.keys(groups).map(type => {
    const t = ITEM_TYPES[type] || ITEM_TYPES.other;
    return `
      <div style="margin-bottom:22px">
        <div style="font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; margin-bottom:10px">${t.icon} ${t.label}</div>
        ${groups[type].map(i => itemRow(i)).join('')}
      </div>
    `;
  }).join('');
}

function itemRow(i) {
  const t = ITEM_TYPES[i.type] || ITEM_TYPES.other;
  const recNames = (i.recipients || []).map(rid => {
    const r = state.data.recipients.find(x => x.id === rid);
    return r ? esc(r.name) : null;
  }).filter(Boolean);
  return `<div class="item">
    <div class="item-ico">${t.icon}</div>
    <div class="item-body">
      <div class="title">${esc(i.title)}</div>
      <div class="meta">
        ${(i.recipients || []).length
          ? `<span class="tag ${t.color}">${(i.recipients || []).length} kedvezményezett</span>`
          : `<span class="tag">Nincs hozzárendelve</span>`}
        ${recNames.slice(0, 3).join(', ')}${recNames.length > 3 ? '…' : ''}
        <span style="margin-left:8px; color:var(--muted)">· ${fmtDate(i.created)}</span>
      </div>
    </div>
    <button class="btn sm" onclick="openItemModal('${i.id}')">Szerkeszt</button>
    <button class="btn sm ghost" onclick="deleteItem('${i.id}')" title="Törlés">✕</button>
  </div>`;
}

function openItemModal(id) {
  const edit = id ? state.data.items.find(x => x.id === id) : null;
  const item = edit || { type: 'password', title: '', fields: {}, recipients: [], notes: '' };
  const t = ITEM_TYPES[item.type] || ITEM_TYPES.other;

  state.modal = {
    title: edit ? 'Elem szerkesztése' : 'Új elem',
    bodyHTML: `
      <div class="field">
        <label>Típus</label>
        <select id="m_type">
          ${Object.entries(ITEM_TYPES).map(([k, v]) =>
            `<option value="${k}" ${item.type === k ? 'selected' : ''}>${v.icon} ${v.label}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Cím</label>
        <input id="m_title" value="${esc(item.title)}" placeholder="pl. Gmail fiók, OTP bankkártya">
      </div>
      <div id="m_dynamic"></div>
      <div class="field">
        <label>Megjegyzés / utasítás a kedvezményezettnek</label>
        <textarea id="m_notes" placeholder="pl. Ez a fiók a fotóidat tartalmazza. Kérlek töltsd le, mielőtt törölnéd.">${esc(item.notes || '')}</textarea>
      </div>
      <div class="field">
        <label>Ki kapja meg?</label>
        ${state.data.recipients.length === 0
          ? `<div class="hint">Még nincs kedvezményezett. <a href="#" onclick="state.modal=null;state.tab='recipients';render();return false" style="color:var(--accent)">Vegyél fel egyet →</a></div>`
          : state.data.recipients.map(r => `
              <label style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border-radius:8px;margin-bottom:6px;cursor:pointer">
                <input type="checkbox" data-rid="${r.id}" ${(item.recipients || []).includes(r.id) ? 'checked' : ''} style="width:auto">
                <span style="color:var(--text);margin:0">${esc(r.name)} <small style="color:var(--muted)">— ${esc(r.relation || '')}</small></span>
              </label>
            `).join('')
        }
      </div>
    `,
    footHTML: `
      <button class="btn ghost" onclick="closeModal()">Mégse</button>
      <button class="btn primary" onclick="saveItem(${edit ? `'${edit.id}'` : 'null'})">Mentés</button>
    `,
    onMount: () => {
      renderDynamicFields(item.fields || {}, item.type);
      document.getElementById('m_type').onchange = (e) => {
        renderDynamicFields({}, e.target.value);
      };
    }
  };
  render();
}

function renderDynamicFields(fields, type) {
  const el = document.getElementById('m_dynamic');
  if (!el) return;
  const F = (k, label, ph, val) => `
    <div class="field">
      <label>${label}</label>
      <input data-field="${k}" value="${esc(val || '')}" placeholder="${ph}">
    </div>`;
  let html = '';
  if (type === 'password') {
    html = F('site', 'Webhely / szolgáltatás', 'accounts.google.com', fields.site)
         + F('username', 'Felhasználónév / e-mail', 'példa@email.hu', fields.username)
         + F('password', 'Jelszó', '••••••••', fields.password)
         + F('twofa', '2FA / helyreállítási kódok', 'ha van', fields.twofa);
  } else if (type === 'bank') {
    html = F('bank', 'Bank neve', 'pl. OTP', fields.bank)
         + F('account', 'Számlaszám / IBAN', 'HU..', fields.account)
         + F('card', 'Kártyaszám (utolsó 4)', '•••• 1234', fields.card)
         + F('notes2', 'Egyéb', 'pl. netbank belépés', fields.notes2);
  } else if (type === 'crypto') {
    html = F('wallet', 'Tárca neve', 'pl. Ledger, MetaMask', fields.wallet)
         + F('address', 'Nyilvános cím', '0x...', fields.address)
         + F('seed', 'Seed phrase / helye', 'Hol van elrejtve papíron?', fields.seed);
  } else if (type === 'insurance') {
    html = F('company', 'Biztosító', '', fields.company)
         + F('policy', 'Kötvényszám', '', fields.policy)
         + F('contact', 'Kapcsolattartó / ügynök', '', fields.contact)
         + F('notes2', 'Egyéb feltételek', '', fields.notes2);
  } else if (type === 'message') {
    html = F('subject', 'Tárgy', 'pl. Szeretlek, anya', fields.subject)
         + `<div class="field"><label>Üzenet</label>
            <textarea data-field="body" placeholder="Írd le, amit mondani szeretnél…" style="min-height:160px">${esc(fields.body || '')}</textarea></div>`;
  } else if (type === 'doc') {
    html = F('location', 'Fizikai hely', 'pl. fiókban a nappaliban, mappa', fields.location)
         + F('desc', 'Leírás', 'Mi van ott és miért fontos?', fields.desc);
  } else if (type === 'access') {
    html = F('device', 'Eszköz', 'pl. iPhone, laptop', fields.device)
         + F('pin', 'PIN / jelszó', '', fields.pin)
         + F('where', 'Hol található', '', fields.where);
  } else {
    html = F('text', 'Tartalom', 'Bármi, amit meg szeretnél osztani', fields.text);
  }
  el.innerHTML = html;
}

async function saveItem(id) {
  const type = document.getElementById('m_type').value;
  const title = document.getElementById('m_title').value.trim();
  if (!title) { toast('Adj címet az elemnek', 'danger'); return; }
  const fields = {};
  document.querySelectorAll('#m_dynamic [data-field]').forEach(el => {
    fields[el.dataset.field] = el.value;
  });
  const notes = document.getElementById('m_notes').value;
  const recipients = [];
  document.querySelectorAll('#m_dynamic input[type=checkbox][data-rid], [data-rid]').forEach(el => {
    if (el.checked) recipients.push(el.dataset.rid);
  });

  if (id) {
    const item = state.data.items.find(x => x.id === id);
    Object.assign(item, { type, title, fields, notes, recipients });
    logEvent(`Elem szerkesztve: ${title}`);
    toast('Elem frissítve', 'success');
  } else {
    state.data.items.push({ id: randomId(), type, title, fields, notes, recipients, created: Date.now() });
    logEvent(`Új elem: ${title}`);
    toast('Elem hozzáadva', 'success');
  }
  closeModal();
  await persist();
}

async function deleteItem(id) {
  const item = state.data.items.find(x => x.id === id);
  if (!item || !confirm(`Törlöd: „${item.title}”?`)) return;
  state.data.items = state.data.items.filter(x => x.id !== id);
  logEvent(`Elem törölve: ${item.title}`);
  await persist();
  toast('Törölve');
  render();
}

/* ---------- Recipients ---------- */

  body.innerHTML = state.data.recipients.map((r, idx) => {

              <div style="font-weight:650">${esc(r.name)}</div>

            </div>
          </div>
          <div class="row">
            <button class="btn sm" onclick="openRecipientModal('${r.id}')">Szerkeszt</button>
            <button class="btn sm ghost" onclick="deleteRecipient('${r.id}')">✕</button>
          </div>
        </div>
        ${r.note ? `<div style="color:var(--muted); font-size:13.5px; margin-bottom:12px">${esc(r.note)}</div>` : ''}
        <div style="font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; margin-bottom:8px">
          Kap: ${assigned.length} elem
        </div>
        ${assigned.length === 0
          ? `<div class="hint">Még nincs hozzárendelt elem.</div>`
          : assigned.map(i => {
              const t = ITEM_TYPES[i.type] || ITEM_TYPES.other;
              return `<div style="display:inline-block; margin:0 6px 6px 0" class="tag ${t.color}">${t.icon} ${esc(i.title)}</div>`;
            }).join('')
        }
        <div style="margin-top:12px">
          <button class="btn sm" onclick="openReleaseModal('${r.id}')">🔓 Kioldási csomag generálása</button>
        </div>
      </div>
    `;
  }).join('');
}

function openRecipientModal(id) {
  const edit = id ? state.data.recipients.find(x => x.id === id) : null;
  const r = edit || { name: '', relation: '', email: '', phone: '', note: '' };
  state.modal = {
    title: edit ? 'Kedvezményezett szerkesztése' : 'Új kedvezményezett',
    bodyHTML: `
      <div class="field"><label>Név</label><input id="r_name" value="${esc(r.name)}" placeholder="pl. Kovács Anna"></div>
      <div class="field"><label>Kapcsolat</label><input id="r_rel" value="${esc(r.relation || '')}" placeholder="pl. házastárs, ügyvéd, testvér"></div>
      <div class="field"><label>E-mail</label><input id="r_email" value="${esc(r.email || '')}" type="email" placeholder="anna@email.hu"></div>
      <div class="field"><label>Telefon</label><input id="r_phone" value="${esc(r.phone || '')}" placeholder="+36 ..."></div>
      <div class="field"><label>Megjegyzés</label><textarea id="r_note" placeholder="pl. Ő az egyetlen, aki ismeri a seed phrase helyét.">${esc(r.note || '')}</textarea></div>
    `,
    footHTML: `
      <button class="btn ghost" onclick="closeModal()">Mégse</button>
      <button class="btn primary" onclick="saveRecipient(${edit ? `'${edit.id}'` : 'null'})">Mentés</button>
    `
  };
  render();
}

async function saveRecipient(id) {
  const name = document.getElementById('r_name').value.trim();
  if (!name) { toast('Adj nevet', 'danger'); return; }
  const data = {
    name,
    relation: document.getElementById('r_rel').value,
    email: document.getElementById('r_email').value,
    phone: document.getElementById('r_phone').value,
    note: document.getElementById('r_note').value,
  };
  if (id) {
    Object.assign(state.data.recipients.find(x => x.id === id), data);
    logEvent(`Kedvezményezett szerkesztve: ${name}`);
  } else {
    state.data.recipients.push({ id: randomId(), created: Date.now(), ...data });
    logEvent(`Új kedvezményezett: ${name}`);
  }
  closeModal();
  await persist();
  toast('Mentve', 'success');
}

async function deleteRecipient(id) {
  const r = state.data.recipients.find(x => x.id === id);
  if (!r || !confirm(`Törlöd: „${r.name}”? Az elemekről is lekerül.`)) return;
  state.data.recipients = state.data.recipients.filter(x => x.id !== id);
  state.data.items.forEach(i => {
    i.recipients = (i.recipients || []).filter(x => x !== id);
  });
  logEvent(`Kedvezményezett törölve: ${r.name}`);
  await persist();
  toast('Törölve');
  render();
}

/* ---------- Release package ---------- */
function openReleaseModal(rid) {
  const r = state.data.recipients.find(x => x.id === rid);
  if (!r) return;
  const items = state.data.items.filter(i => (i.recipients || []).includes(rid));
  if (items.length === 0) { toast('Nincs hozzárendelt elem', 'warn'); return; }
  state.modal = {
    title: `Kioldási csomag — ${esc(r.name)}`,
    bodyHTML: `
      <p style="color:var(--muted); font-size:13.5px; margin-bottom:16px">
        Ez a csomag <b>${items.length}</b> elemet tartalmaz. Titkosítva lesz egy külön jelszóval, amit megadsz <b>${esc(r.name)}</b>-nek.
        Nyomtasd ki ezt a jelszót, és tartsd vele egy biztonságos helyen (végrendelet, ügyvéd, széf).
      </p>
      <div class="field">
        <label>Csomag jelszava (generálom, de átírható)</label>
        <div class="row">
          <input id="rel_pw" value="${randomPassphrase(4)}-${Math.floor(Math.random()*9000+1000)}">
          <button class="btn sm" onclick="document.getElementById('rel_pw').value = randomPassphrase(4)+'-'+Math.floor(Math.random()*9000+1000)">↻</button>
        </div>
        <div class="hint">Ezt add át ${esc(r.name)}-nek <b>külön csatornán</b> (pl. személyesen, papíron).</div>
      </div>
      <div class="field">
        <label>Elmegy az elemek listája</label>
        <div style="background:var(--panel2); padding:10px 14px; border-radius:9px; font-size:13px; color:var(--muted)">
          ${items.map(i => `• ${esc(i.title)}`).join('<br>')}
        </div>
      </div>
    `,
    footHTML: `
      <button class="btn ghost" onclick="closeModal()">Mégse</button>
      <button class="btn primary" onclick="exportRelease('${rid}')">📥 Csomag letöltése</button>
    `
  };
  render();
}

async function exportRelease(rid) {
  const r = state.data.recipients.find(x => x.id === rid);
  const items = state.data.items.filter(i => (i.recipients || []).includes(rid));
  const pw = document.getElementById('rel_pw').value;
  if (pw.length < 6) { toast('A jelszó túl rövid', 'danger'); return; }

  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(pw, salt, 200000);
  const payload = {
    version: 1,
    createdAt: Date.now(),
    owner: state.data.config.executorName || 'Ismeretlen',
    recipient: { name: r.name, relation: r.relation, email: r.email },
    message: state.data.config.emergencyNote || '',
    items: items.map(i => ({
      title: i.title,
      type: i.type,
      typeLabel: (ITEM_TYPES[i.type] || ITEM_TYPES.other).label,
      fields: i.fields,
      notes: i.notes,
    })),
  };
  const blob = await encryptJSON(key, payload);
  const out = {
    format: 'orokseg-szef-release-v1',
    salt: b64(salt),
    iv: blob.iv,
    ct: blob.ct,
    info: {
      recipient: r.name,
      owner: state.data.config.executorName || '',
      itemCount: items.length,
      createdAt: Date.now(),
    },
  };
  download(`orokseg-${r.name.replace(/\s+/g, '-').toLowerCase()}-${Date.now()}.release.json`,
    JSON.stringify(out, null, 2));
  logEvent(`Kioldási csomag generálva: ${r.name}`);
  await persist();
  toast('Csomag letöltve. Add át a jelszót a kedvezményezettnek!', 'success');
}

/* ---------- Dead man's switch ---------- */
function renderSwitch(body, actions, s) {
  actions.innerHTML = `<button class="btn primary" onclick="doCheckIn()">✓ Bejelentkezés most</button>`;
  const c = state.data.config;

  let banner = '';
  if (s.status === 'overdue') {
    banner = `<div class="hero danger"><div><div class="label">Figyelem</div>
      <div class="num">LEJÁRT</div>
      <div class="sub">A kapcsoló kivált. Most kell kézbesíteni a csomagokat a kedvezményezetteknek.</div>
    </div></div>`;
  } else if (s.status === 'grace') {
    banner = `<div class="hero danger"><div><div class="label">Türelmi idő</div>
      <div class="num">${s.graceLeft} nap</div>
      <div class="sub">Ha nem jelentkezel be, a széf kiold.</div>
    </div></div>`;
  } else if (s.status === 'warn') {
    banner = `<div class="hero warn"><div><div class="label">Közeledik</div>
      <div class="num">${s.daysLeft} nap</div>
      <div class="sub">Jelentkezz be a következő 5 napban.</div>
    </div></div>`;
  }

  body.innerHTML = `
    ${banner}
    <div class="card">
      <h3>Kapcsoló beállításai</h3>
      <div class="grid-2">
        <div class="field">
          <label>Bejelentkezési időköz (nap)</label>
          <input type="number" id="sw_interval" min="1" max="730" value="${c.checkInIntervalDays}">
          <div class="hint">Ennyi naponta kell bejelentkezned. Ha elmulasztod, elindul a türelmi idő.</div>
        </div>
        <div class="field">
          <label>Türelmi idő (nap)</label>
          <input type="number" id="sw_grace" min="0" max="90" value="${c.gracePeriodDays}">
          <div class="hint">Ennyi napod van pótolni, mielőtt a széf kiold.</div>
        </div>
      </div>
      <div class="field">
        <label>Üzenet a kedvezményezetteknek (a kioldási csomagokhoz csatolva)</label>
        <textarea id="sw_note" placeholder="pl. Ha ezt olvassátok, tudjátok, hogy mindent megtettem, hogy felkészüljek. Kérlek, először hívjátok fel Évát.">${esc(c.emergencyNote || '')}</textarea>
      </div>
      <button class="btn primary" onclick="saveSwitch()">Beállítások mentése</button>
    </div>

    <div class="card">
      <h3>Idővonal</h3>
      <div class="scroll-x">
      <table>
        <tr><th>Esemény</th><th>Dátum</th><th>Státusz</th></tr>
        <tr>
          <td>Utolsó bejelentkezés</td>
          <td>${fmtDateTime(s.last)}</td>
          <td><span class="tag green">✓</span></td>
        </tr>
        <tr>
          <td>Következő esedékes</td>
          <td>${fmtDate(s.deadline)}</td>
          <td><span class="tag ${s.status === 'ok' ? 'blue' : s.status === 'warn' ? 'orange' : ''}">${s.status === 'ok' ? 'Várható' : s.status === 'warn' ? 'Hamarosan' : 'Lejárt'}</span></td>
        </tr>
        <tr>
          <td>Türelmi idő vége (kioldás)</td>
          <td>${fmtDate(s.graceEnd)}</td>
          <td><span class="tag purple">Kioldás</span></td>
        </tr>
      </table>
      </div>
    </div>

    <div class="card">
      <h3>Hogyan működik a gyakorlatban?</h3>
      <p style="color:var(--muted); font-size:13.5px; line-height:1.75">
        1. Amíg élsz, rendszeresen (pl. havonta) bejelentkezel ide, és megnyomod a „Bejelentkezés most” gombot.<br>
        2. Ha elmulasztod, és letelik a türelmi idő, ez az oldal <b>kioldás módba</b> kerül: a fejléc figyelmeztet, a kedvezményezettek csomagjai pedig letölthetők lesznek.<br>
        3. A csomagokat és a hozzá tartozó jelszavakat <b>előre</b> el kell juttatnod a kedvezményezettekhez vagy a végrehajtóhoz (ügyvéd, jegyző, családtag).<br>
        4. Az üzenetváltás nélküli, automatikus e-mail-küldést szándékosan nem tartalmazza: minden helyben, a böngésződben marad.
      </p>
    </div>
  `;
}

async function saveSwitch() {
  state.data.config.checkInIntervalDays = Math.max(1, parseInt(document.getElementById('sw_interval').value) || 30);
  state.data.config.gracePeriodDays = Math.max(0, parseInt(document.getElementById('sw_grace').value) || 7);
  state.data.config.emergencyNote = document.getElementById('sw_note').value;
  logEvent('Kapcsoló beállítások frissítve');
  await persist();
  toast('Beállítások mentve', 'success');
  render();
}

async function doCheckIn() {
  state.data.config.lastCheckIn = Date.now();
  logEvent('Bejelentkezés');
  await persist();
  toast('Bejelentkezve — az óra újraindult', 'success');
  render();
}

/* ---------- Log ---------- */
function renderLog(body, actions) {
  actions.innerHTML = `<button class="btn ghost" onclick="clearLog()">Napló törlése</button>`;
  if (state.data.log.length === 0) {
    body.innerHTML = `<div class="empty"><div class="big">📜</div><p>Még nincs esemény.</p></div>`;
    return;
  }
  body.innerHTML = `<div class="card">
    <div class="scroll-x"><table>
      <tr><th style="width:180px">Időpont</th><th>Esemény</th></tr>
      ${state.data.log.map(l => `<tr><td style="color:var(--muted)">${fmtDateTime(l.t)}</td><td>${esc(l.msg)}</td></tr>`).join('')}
    </table></div>
  </div>`;
}
async function clearLog() {
  if (!confirm('Törlöd a naplót?')) return;
  state.data.log = [];
  await persist();
  render();
}

/* ---------- Settings ---------- */
function renderSettings(body, actions) {
  actions.innerHTML = '';
  const c = state.data.config;
  body.innerHTML = `
    <div class="card">
      <h3>Végrehajtó / ügyvéd</h3>
      <div class="grid-2">
        <div class="field"><label>Név</label><input id="s_exec" value="${esc(c.executorName || '')}" placeholder="pl. Dr. Kovács Péter ügyvéd"></div>
        <div class="field"><label>Elérhetőség</label><input id="s_execcontact" value="${esc(c.executorContact || '')}" placeholder="telefon, e-mail, cím"></div>
      </div>
      <button class="btn primary" onclick="saveSettings()">Mentés</button>
    </div>

    <div class="card">
      <h3>Titkosított biztonsági másolat</h3>
      <p style="color:var(--muted); font-size:13.5px; margin-bottom:12px">
        A mentett fájl a jelenlegi mesterjelszóval titkosított. Ha elveszíted a jelszót, a mentés is elveszik.
        Tárold külső meghajtón vagy nyomtatott papíron a jelszót.
      </p>
      <div class="row">
        <button class="btn" onclick="exportBackup()">📥 Export (titkosított)</button>
        <label class="btn" style="cursor:pointer">
          📤 Import
          <input type="file" accept="application/json" style="display:none" onchange="importBackup(event)">
        </label>
      </div>
    </div>

    <div class="card">
      <h3>Biztonság</h3>
      <div class="row between" style="padding:8px 0">
        <div>
          <div style="font-weight:600">Automatikus zárolás</div>
          <div class="hint">10 perc tétlenség után a széf újra kéri a jelszót.</div>
        </div>
        <div style="color:var(--success); font-weight:600">Bekapcsolva</div>
      </div>
      <div class="divider"></div>
      <div class="row between" style="padding:8px 0">
        <div>
          <div style="font-weight:600">Mesterjelszó cseréje</div>
          <div class="hint">Új kulcs származik, a széf teljesen újratitkosítódik.</div>
        </div>
        <button class="btn sm" onclick="openChangePassword()">Csere</button>
      </div>
    </div>

    <div class="card danger-zone">
      <h3>Veszélyzóna</h3>
      <div class="row between" style="padding:8px 0">
        <div>
          <div style="font-weight:600">Széf teljes törlése</div>
          <div class="hint">Minden adat, kedvezményezett és napló véglegesen törlődik erről az eszközről.</div>
        </div>
        <button class="btn danger sm" onclick="wipeVault()">Törlés</button>
      </div>
    </div>

    <div class="card">
      <h3>Névjegy</h3>
      <p style="color:var(--muted); font-size:13.5px; line-height:1.7">
        <b>ÖrökségSzéf</b> — egy fájlból álló, szerver nélküli digitális végrendelet.
        Minden adat a böngésződ tárolójában marad, AES-256-GCM titkosítással.
        Nincs felhő, nincs regisztráció, nincs telemetria.
      </p>
    </div>
  `;
}

async function saveSettings() {
  state.data.config.executorName = document.getElementById('s_exec').value;
  state.data.config.executorContact = document.getElementById('s_execcontact').value;
  logEvent('Beállítások mentve');
  await persist();
  toast('Mentve', 'success');
}

async function exportBackup() {
  const raw = localStorage.getItem(STORAGE_KEY);
  download(`orokseg-szef-backup-${Date.now()}.json`, raw);
  toast('Biztonsági másolat letöltve', 'success');
}

function importBackup(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed.salt || !parsed.iv || !parsed.ct) throw new Error('bad');
      if (!confirm('Ez felülírja a jelenlegi széfet. Folytatod?')) return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
      location.reload();
    } catch { toast('Érvénytelen fájl', 'danger'); }
  };
  reader.readAsText(file);
}

function openChangePassword() {
  state.modal = {
    title: 'Mesterjelszó cseréje',
    bodyHTML: `
      <div class="field"><label>Új mesterjelszó</label><input type="password" id="np1"></div>
      <div class="field"><label>Új mesterjelszó újra</label><input type="password" id="np2"></div>
      <div class="hint">⚠️ A régi biztonsági másolatokhoz a régi jelszó kell. Készíts újat a csere után.</div>
    `,
    footHTML: `
      <button class="btn ghost" onclick="closeModal()">Mégse</button>
      <button class="btn primary" onclick="changePassword()">Csere</button>
    `
  };
  render();
}

async function changePassword() {
  const p1 = document.getElementById('np1').value;
  const p2 = document.getElementById('np2').value;
  if (p1.length < 8) { toast('Legalább 8 karakter', 'danger'); return; }
  if (p1 !== p2) { toast('Nem egyezik', 'danger'); return; }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  state.salt = salt;
  state.key = await deriveKey(p1, salt);
  logEvent('Mesterjelszó megváltozott');
  await persist();
  closeModal();
  toast('Mesterjelszó megváltozott', 'success');
}

async function wipeVault() {
  if (!confirm('VÉGLEGES törlés. Biztos vagy benne?')) return;
  if (!confirm('Tényleg? Minden elveszik, ami a széfben van.')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

/* ---------- Modal plumbing ---------- */
function renderModal() {
  const m = state.modal;
  const existing = document.getElementById('modalRoot');
  if (existing) existing.remove();
  const wrap = document.createElement('div');
  wrap.id = 'modalRoot';
  wrap.className = 'modal-bg';
  wrap.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h3>${m.title}</h3>
        <button class="close-x" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">${m.bodyHTML}</div>
      <div class="modal-foot">${m.footHTML}</div>
    </div>
  `;
  wrap.onclick = (e) => { if (e.target === wrap) closeModal(); };
  document.body.appendChild(wrap);
  if (m.onMount) m.onMount();
}
function closeModal() {
  state.modal = null;
  const el = document.getElementById('modalRoot');
  if (el) el.remove();
}

/* ---------- Download helper ---------- */
function download(filename, content) {
  const blob = new Blob([content], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
}

/* ---------- Auto-lock ---------- */
let idleTimer;
function resetIdle() {
  state.lastActivity = Date.now();
  clearTimeout(idleTimer);
  if (state.unlocked) {
    idleTimer = setTimeout(() => {
      if (Date.now() - state.lastActivity >= SESSION_TIMEOUT_MS) {
        lockNow();
        toast('Automatikus zárolás tétlenség miatt', 'warn');
      }
    }, SESSION_TIMEOUT_MS + 500);
  }
}
function lockNow() {
  state.key = null;
  state.data = null;
  state.unlocked = false;
  state.modal = null;
  document.getElementById('modalRoot')?.remove();
  render();
}
['mousemove','keydown','click','scroll','touchstart'].forEach(e =>
  window.addEventListener(e, resetIdle, { passive: true }));

/* ---------- Root render ---------- */
function render() {
  const root = document.getElementById('root');
  if (!state.unlocked) {
    renderLock(root);
  } else {
    renderApp(root);
    resetIdle();
  }
}

render();
</script>
</body>
</html>
