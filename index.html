<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AetherVault — Személyes tudásgráf & bizonyíték-napló</title>
<style>
  :root {
    --bg: #0b0f14;
    --surface: #12181f;
    --surface2: #1a222d;
    --border: #2a3544;
    --text: #e8eef6;
    --muted: #8b9bb4;
    --accent: #5b9cff;
    --accent2: #7c5cff;
    --success: #3dd68c;
    --warn: #f5a524;
    --danger: #f31260;
    --radius: 12px;
    --font: "Inter", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  .sidebar {
    width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .logo {
    padding: 20px 18px 12px;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo span { color: var(--accent); }
  .nav { flex: 1; overflow-y: auto; padding: 8px; }
  .nav-section { margin-bottom: 18px; }
  .nav-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding: 6px 10px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.92rem;
    transition: all 0.15s;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(91,156,255,0.12); color: var(--accent); }
  .nav-item .count {
    margin-left: auto;
    font-size: 0.75rem;
    background: var(--surface2);
    padding: 1px 7px;
    border-radius: 10px;
    color: var(--muted);
  }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    height: 56px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    background: var(--surface);
  }
  .search-wrap { flex: 1; max-width: 420px; position: relative; }
  .search-wrap input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px 8px 36px;
    color: var(--text);
    font-size: 0.9rem;
  }
  .search-wrap svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
  }
  .btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--border); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }

  .content { flex: 1; overflow-y: auto; padding: 24px; }

  /* Cards grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card-title { font-weight: 600; font-size: 1.05rem; }
  .card-meta { font-size: 0.78rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .tag {
    display: inline-block;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(91,156,255,0.15);
    color: var(--accent);
  }
  .tag.warn { background: rgba(245,165,36,0.15); color: var(--warn); }
  .tag.success { background: rgba(61,214,140,0.15); color: var(--success); }
  .tag.danger { background: rgba(243,18,96,0.15); color: var(--danger); }
  .card-excerpt { font-size: 0.88rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* Detail / Editor */
  .editor-view { max-width: 780px; margin: 0 auto; }
  .editor-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 12px; }
  .editor-title {
    font-size: 1.6rem;
    font-weight: 700;
    background: transparent;
    border: none;
    color: var(--text);
    width: 100%;
    outline: none;
  }
  .editor-title::placeholder { color: var(--muted); }
  .field-group { margin-bottom: 18px; }
  .field-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; display: block; }
  textarea, input[type="text"], select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    resize: vertical;
  }
  textarea { min-height: 120px; }
  .evidence-list { display: flex; flex-direction: column; gap: 10px; }
  .evidence-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
  }
  .evidence-item .source { font-size: 0.82rem; color: var(--accent); }
  .cred-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }
  .cred-fill { height: 100%; border-radius: 2px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty h2 { color: var(--text); margin-bottom: 8px; }
  .empty p { max-width: 400px; margin: 0 auto 20px; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 90%; max-width: 480px;
    padding: 24px;
    transform: translateY(12px); transition: transform 0.2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal h3 { margin-bottom: 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .stat-value { font-size: 1.8rem; font-weight: 700; }
  .stat-label { font-size: 0.8rem; color: var(--muted); }

  /* Graph view */
  .graph-container {
    height: calc(100vh - 140px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    position: relative;
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; }

  /* Responsive */
  @media (max-width: 768px) {
    .sidebar { width: 64px; }
    .nav-label, .logo span, .nav-item span:not(.icon) { display: none; }
    .logo { justify-content: center; }
    .nav-item { justify-content: center; }
  }
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <span>AetherVault</span>
    </div>
    <nav class="nav">
      <div class="nav-section">
        <div class="nav-label">Nézetek</div>
        <div class="nav-item active" data-view="claims">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>Állítások</span>
          <span class="count" id="count-claims">0</span>
        </div>
        <div class="nav-item" data-view="graph">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          <span>Tudásgráf</span>
        </div>
        <div class="nav-item" data-view="stats">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
          <span>Statisztika</span>
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-label">Szűrők</div>
        <div class="nav-item" data-filter="all">
          <span class="icon">◉</span><span>Összes</span>
        </div>
        <div class="nav-item" data-filter="verified">
          <span class="icon">✓</span><span>Ellenőrzött</span>
        </div>
        <div class="nav-item" data-filter="disputed">
          <span class="icon">⚠</span><span>Vitatott</span>
        </div>
        <div class="nav-item" data-filter="unverified">
          <span class="icon">?</span><span>Ellenőrizetlen</span>
        </div>
      </div>
    </nav>
    <div style="padding:12px;border-top:1px solid var(--border)">
      <button class="btn primary" style="width:100%" id="btn-new">+ Új állítás</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search" placeholder="Keresés állítások, források, címkék között…">
      </div>
      <button class="btn" id="btn-export">Export JSON</button>
      <button class="btn" id="btn-import">Import</button>
      <input type="file" id="import-file" accept=".json" style="display:none">
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">Új állítás</h3>
    <div class="field-group">
      <label class="field-label">Állítás</label>
      <input type="text" id="m-claim" placeholder="Pl. A Föld átlaghőmérséklete 2025-ben 1.5°C-kal nőtt az ipari forradalom óta">
    </div>
    <div class="field-group">
      <label class="field-label">Státusz</label>
      <select id="m-status">
        <option value="unverified">Ellenőrizetlen</option>
        <option value="verified">Ellenőrzött</option>
        <option value="disputed">Vitatott</option>
      </select>
    </div>
    <div class="field-group">
      <label class="field-label">Címkék (vesszővel)</label>
      <input type="text" id="m-tags" placeholder="klíma, tudomány, 2025">
    </div>
    <div class="field-group">
      <label class="field-label">Jegyzet / kontextus</label>
      <textarea id="m-note" placeholder="Miért fontos? Honnan hallottad?"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="modal-cancel">Mégse</button>
      <button class="btn primary" id="modal-save">Mentés</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'aethervault_v1';
let data = { claims: [] };
let currentView = 'claims';
let currentFilter = 'all';
let editingId = null;
let searchQuery = '';

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch(e) {}
  if (!data.claims) data.claims = [];
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  updateCounts();
}

function updateCounts() {
  document.getElementById('count-claims').textContent = data.claims.length;
}

function statusLabel(s) {
  return { verified: 'Ellenőrzött', disputed: 'Vitatott', unverified: 'Ellenőrizetlen' }[s] || s;
}
function statusClass(s) {
  return { verified: 'success', disputed: 'warn', unverified: '' }[s] || '';
}

function filteredClaims() {
  let list = data.claims;
  if (currentFilter !== 'all') list = list.filter(c => c.status === currentFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(c =>
      c.claim.toLowerCase().includes(q) ||
      (c.note||'').toLowerCase().includes(q) ||
      (c.tags||[]).some(t => t.toLowerCase().includes(q)) ||
      (c.evidence||[]).some(e => (e.source||'').toLowerCase().includes(q) || (e.quote||'').toLowerCase().includes(q))
    );
  }
  return list.sort((a,b) => b.updated - a.updated);
}

function render() {
  const content = document.getElementById('content');
  if (currentView === 'claims') renderClaims(content);
  else if (currentView === 'graph') renderGraph(content);
  else if (currentView === 'stats') renderStats(content);
  else if (currentView === 'detail') renderDetail(content, editingId);
}

function renderClaims(el) {
  const list = filteredClaims();
  if (!list.length) {
    el.innerHTML = `
      <div class="empty">
        <h2>Még nincsenek állítások</h2>
        <p>A 2026-os információs zajban a legértékesebb dolog a saját, forrásokkal alátámasztott tudásgráfod. Kezdj el gyűjteni és ellenőrizni.</p>
        <button class="btn primary" onclick="openModal()">+ Első állítás</button>
      </div>`;
    return;
  }
  el.innerHTML = `<div class="grid">${list.map(c => `
    <div class="card" onclick="openDetail('${c.id}')">
      <div class="card-title">${escapeHtml(c.claim)}</div>
      <div class="card-meta">
        <span class="tag ${statusClass(c.status)}">${statusLabel(c.status)}</span>
        ${(c.tags||[]).slice(0,3).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
        <span>${new Date(c.updated).toLocaleDateString('hu')}</span>
      </div>
      <div class="card-excerpt">${escapeHtml(c.note || (c.evidence&&c.evidence[0]&&c.evidence[0].quote) || '')}</div>
    </div>`).join('')}</div>`;
}

function renderDetail(el, id) {
  const c = data.claims.find(x => x.id === id);
  if (!c) { currentView = 'claims'; render(); return; }
  el.innerHTML = `
    <div class="editor-view">
      <div class="editor-header">
        <input class="editor-title" id="d-claim" value="${escapeHtml(c.claim)}">
        <button class="btn ghost" onclick="currentView='claims';render()">← Vissza</button>
      </div>
      <div class="field-group">
        <label class="field-label">Státusz</label>
        <select id="d-status">
          <option value="unverified" ${c.status==='unverified'?'selected':''}>Ellenőrizetlen</option>
          <option value="verified" ${c.status==='verified'?'selected':''}>Ellenőrzött</option>
          <option value="disputed" ${c.status==='disputed'?'selected':''}>Vitatott</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">Címkék</label>
        <input type="text" id="d-tags" value="${escapeHtml((c.tags||[]).join(', '))}">
      </div>
      <div class="field-group">
        <label class="field-label">Jegyzet / kontextus</label>
        <textarea id="d-note">${escapeHtml(c.note||'')}</textarea>
      </div>
      <div class="field-group">
        <label class="field-label">Bizonyítékok / források</label>
        <div class="evidence-list" id="evidence-list">
          ${(c.evidence||[]).map((e,i) => evidenceHtml(e,i)).join('')}
        </div>
        <button class="btn" style="margin-top:10px" onclick="addEvidence()">+ Forrás hozzáadása</button>
      </div>
      <div class="actions">
        <button class="btn primary" onclick="saveDetail('${c.id}')">Mentés</button>
        <button class="btn danger" onclick="deleteClaim('${c.id}')">Törlés</button>
      </div>
    </div>`;
}

function evidenceHtml(e, i) {
  const cred = e.credibility || 50;
  const color = cred >= 70 ? 'var(--success)' : cred >= 40 ? 'var(--warn)' : 'var(--danger)';
  return `
    <div class="evidence-item" data-idx="${i}">
      <div>
        <input type="text" class="e-source" value="${escapeHtml(e.source||'')}" placeholder="Forrás URL vagy név" style="margin-bottom:6px">
        <textarea class="e-quote" rows="2" placeholder="Idézet vagy összefoglaló">${escapeHtml(e.quote||'')}</textarea>
        <div style="display:flex;align-items:center;gap:10px;margin-top:6px">
          <label style="font-size:0.78rem;color:var(--muted)">Megbízhatóság:</label>
          <input type="range" class="e-cred" min="0" max="100" value="${cred}" style="flex:1">
          <span class="cred-val" style="font-size:0.8rem;min-width:28px">${cred}%</span>
        </div>
        <div class="cred-bar"><div class="cred-fill" style="width:${cred}%;background:${color}"></div></div>
      </div>
      <button class="btn ghost" onclick="removeEvidence(${i})" style="align-self:start">×</button>
    </div>`;
}

function addEvidence() {
  const c = data.claims.find(x => x.id === editingId);
  if (!c) return;
  if (!c.evidence) c.evidence = [];
  c.evidence.push({ source: '', quote: '', credibility: 50 });
  renderDetail(document.getElementById('content'), editingId);
  bindEvidenceEvents();
}

function removeEvidence(idx) {
  const c = data.claims.find(x => x.id === editingId);
  if (!c || !c.evidence) return;
  c.evidence.splice(idx, 1);
  renderDetail(document.getElementById('content'), editingId);
  bindEvidenceEvents();
}

function bindEvidenceEvents() {
  document.querySelectorAll('.e-cred').forEach(r => {
    r.oninput = function() {
      const val = this.value;
      const item = this.closest('.evidence-item');
      item.querySelector('.cred-val').textContent = val + '%';
      const fill = item.querySelector('.cred-fill');
      fill.style.width = val + '%';
      fill.style.background = val >= 70 ? 'var(--success)' : val >= 40 ? 'var(--warn)' : 'var(--danger)';
    };
  });
}

function saveDetail(id) {
  const c = data.claims.find(x => x.id === id);
  if (!c) return;
  c.claim = document.getElementById('d-claim').value.trim();
  c.status = document.getElementById('d-status').value;
  c.tags = document.getElementById('d-tags').value.split(',').map(t => t.trim()).filter(Boolean);
  c.note = document.getElementById('d-note').value.trim();
  c.updated = Date.now();
  const items = document.querySelectorAll('.evidence-item');
  c.evidence = Array.from(items).map(item => ({
    source: item.querySelector('.e-source').value.trim(),
    quote: item.querySelector('.e-quote').value.trim(),
    credibility: parseInt(item.querySelector('.e-cred').value, 10)
  })).filter(e => e.source || e.quote);
  save();
  currentView = 'claims';
  render();
}

function deleteClaim(id) {
  if (!confirm('Biztosan törlöd ezt az állítást?')) return;
  data.claims = data.claims.filter(c => c.id !== id);
  save();
  currentView = 'claims';
  render();
}

function openDetail(id) {
  editingId = id;
  currentView = 'detail';
  render();
  bindEvidenceEvents();
}

function openModal(editId) {
  editingId = editId || null;
  document.getElementById('modal-title').textContent = editId ? 'Állítás szerkesztése' : 'Új állítás';
  document.getElementById('m-claim').value = '';
  document.getElementById('m-status').value = 'unverified';
  document.getElementById('m-tags').value = '';
  document.getElementById('m-note').value = '';
  if (editId) {
    const c = data.claims.find(x => x.id === editId);
    if (c) {
      document.getElementById('m-claim').value = c.claim;
      document.getElementById('m-status').value = c.status;
      document.getElementById('m-tags').value = (c.tags||[]).join(', ');
      document.getElementById('m-note').value = c.note || '';
    }
  }
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function saveModal() {
  const claim = document.getElementById('m-claim').value.trim();
  if (!claim) return alert('Az állítás megadása kötelező');
  const status = document.getElementById('m-status').value;
  const tags = document.getElementById('m-tags').value.split(',').map(t => t.trim()).filter(Boolean);
  const note = document.getElementById('m-note').value.trim();
  if (editingId) {
    const c = data.claims.find(x => x.id === editingId);
    if (c) {
      c.claim = claim; c.status = status; c.tags = tags; c.note = note; c.updated = Date.now();
    }
  } else {
    data.claims.push({
      id: uid(),
      claim, status, tags, note,
      evidence: [],
      created: Date.now(),
      updated: Date.now()
    });
  }
  save();
  closeModal();
  currentView = 'claims';
  render();
}

function renderStats(el) {
  const total = data.claims.length;
  const verified = data.claims.filter(c => c.status === 'verified').length;
  const disputed = data.claims.filter(c => c.status === 'disputed').length;
  const withEvidence = data.claims.filter(c => c.evidence && c.evidence.length).length;
  const avgCred = (() => {
    let sum = 0, n = 0;
    data.claims.forEach(c => (c.evidence||[]).forEach(e => { sum += e.credibility||50; n++; }));
    return n ? Math.round(sum / n) : 0;
  })();
  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">Összes állítás</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--success)">${verified}</div><div class="stat-label">Ellenőrzött</div></div>
      <div class="stat-card"><div class="stat-value" style="color:var(--warn)">${disputed}</div><div class="stat-label">Vitatott</div></div>
      <div class="stat-card"><div class="stat-value">${withEvidence}</div><div class="stat-label">Forrással rendelkezik</div></div>
      <div class="stat-card"><div class="stat-value">${avgCred}%</div><div class="stat-label">Átlagos forrás-megbízhatóság</div></div>
    </div>
    <p style="color:var(--muted);max-width:560px">A saját, forrásokkal ellátott tudásgráf a legjobb védelem a 2026+ szintű generatív zaj és deepfake-áradat ellen. Minél több ellenőrzött állításod van, annál erősebb a személyes „igazság-hálód”.</p>`;
}

function renderGraph(el) {
  el.innerHTML = `<div class="graph-container"><canvas id="graph-canvas"></canvas></div>
    <p style="margin-top:12px;font-size:0.85rem;color:var(--muted)">A gráf a címkék és közös források alapján kapcsolja össze az állításokat. Húzd az egérrel a mozgatáshoz.</p>`;
  setTimeout(drawGraph, 50);
}

function drawGraph() {
  const canvas = document.getElementById('graph-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const w = rect.width, h = rect.height;

  const nodes = data.claims.map((c,i) => ({
    id: c.id,
    label: c.claim.slice(0,40) + (c.claim.length>40?'…':''),
    status: c.status,
    tags: c.tags || [],
    x: w/2 + Math.cos(i * 2.3) * (w*0.28),
    y: h/2 + Math.sin(i * 2.3) * (h*0.28),
    vx: 0, vy: 0
  }));

  // simple force
  for (let iter=0; iter<80; iter++) {
    for (let i=0;i<nodes.length;i++) {
      for (let j=i+1;j<nodes.length;j++) {
        const a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let dist = Math.sqrt(dx*dx+dy*dy) || 1;
        let force = (120 - dist) * 0.02;
        // attract if shared tags
        const shared = a.tags.filter(t => b.tags.includes(t)).length;
        if (shared) force -= shared * 8;
        dx /= dist; dy /= dist;
        a.vx -= dx * force; a.vy -= dy * force;
        b.vx += dx * force; b.vy += dy * force;
      }
    }
    nodes.forEach(n => {
      n.x += n.vx * 0.6; n.y += n.vy * 0.6;
      n.vx *= 0.7; n.vy *= 0.7;
      n.x = Math.max(40, Math.min(w-40, n.x));
      n.y = Math.max(40, Math.min(h-40, n.y));
    });
  }

  // edges
  ctx.strokeStyle = 'rgba(91,156,255,0.25)';
  ctx.lineWidth = 1;
  for (let i=0;i<nodes.length;i++) {
    for (let j=i+1;j<nodes.length;j++) {
      const shared = nodes[i].tags.filter(t => nodes[j].tags.includes(t)).length;
      if (shared) {
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();
      }
    }
  }

  // nodes
  nodes.forEach(n => {
    const color = n.status==='verified' ? '#3dd68c' : n.status==='disputed' ? '#f5a524' : '#5b9cff';
    ctx.beginPath();
    ctx.arc(n.x, n.y, 10, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.fillStyle = '#e8eef6';
    ctx.font = '11px Inter, system-ui';
    ctx.fillText(n.label, n.x + 14, n.y + 4);
  });
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Events
document.querySelectorAll('.nav-item[data-view]').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('.nav-item[data-view]').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    currentView = el.dataset.view;
    render();
  };
});
document.querySelectorAll('.nav-item[data-filter]').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('.nav-item[data-filter]').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    currentFilter = el.dataset.filter;
    if (currentView !== 'claims') {
      currentView = 'claims';
      document.querySelectorAll('.nav-item[data-view]').forEach(x => x.classList.remove('active'));
      document.querySelector('[data-view="claims"]').classList.add('active');
    }
    render();
  };
});

document.getElementById('btn-new').onclick = () => openModal();
document.getElementById('modal-cancel').onclick = closeModal;
document.getElementById('modal-save').onclick = saveModal;
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

document.getElementById('search').oninput = e => {
  searchQuery = e.target.value.trim();
  if (currentView === 'claims') render();
};

document.getElementById('btn-export').onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `aethervault-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
};
document.getElementById('btn-import').onclick = () => document.getElementById('import-file').click();
document.getElementById('import-file').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (imported.claims) {
        data = imported;
        save();
        render();
        alert('Import sikeres: ' + data.claims.length + ' állítás');
      }
    } catch(err) { alert('Hibás fájl'); }
  };
  reader.readAsText(file);
};
